<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Taskcell Cloud Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Layout: one dark factory console — top bar, single working column, detail panes at right; map-style accents only on the selected thing. Single dark theme, matching taskcell.dev. */
:root{
  --bg:#0d1013; --surface:#141a1f; --surface-2:#1b2228; --ink:#e8ecef; --muted:#a3adb6; --dim:#8a96a0; --dimmer:#7b858e;
  --accent:#f99a2c; --accent-ink:#14100a; --teal:#79a9ad; --fail:#ff6a5c;
  --line:rgba(121,169,173,.18); --line-strong:rgba(121,169,173,.42); --glow:rgba(249,154,44,.12); --acc-wash:rgba(249,154,44,.07); --fail-wash:rgba(255,106,92,.07); --teal-wash:rgba(121,169,173,.05);
  --scrim:rgba(5,7,9,.72);
  --display:'Schibsted Grotesk',system-ui,sans-serif; --text:'Atkinson Hyperlegible',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.45 var(--text);min-height:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* icons */
svg.lucide{width:16px;height:16px;stroke-width:1.75;flex:none;vertical-align:-3px}
svg.i12{width:12px;height:12px} svg.i14{width:14px;height:14px} svg.i18{width:18px;height:18px} svg.i20{width:20px;height:20px}
svg.spin{animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* map accents, quiet */
.brk{position:relative;--bc:var(--accent);--bl:7px;--bw:1.5px}
.brk::before{content:"";position:absolute;inset:-4px;pointer-events:none;opacity:.85;background:
  linear-gradient(var(--bc),var(--bc)) top left/var(--bl) var(--bw),linear-gradient(var(--bc),var(--bc)) top left/var(--bw) var(--bl),
  linear-gradient(var(--bc),var(--bc)) top right/var(--bl) var(--bw),linear-gradient(var(--bc),var(--bc)) top right/var(--bw) var(--bl),
  linear-gradient(var(--bc),var(--bc)) bottom left/var(--bl) var(--bw),linear-gradient(var(--bc),var(--bc)) bottom left/var(--bw) var(--bl),
  linear-gradient(var(--bc),var(--bc)) bottom right/var(--bl) var(--bw),linear-gradient(var(--bc),var(--bc)) bottom right/var(--bw) var(--bl);
  background-repeat:no-repeat}
.brk.teal{--bc:var(--teal)}
.sh{display:flex;align-items:center;gap:10px;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
.sh .rule{flex:1;height:1px;background:var(--line-strong)}
.sh .cnt{color:var(--ink)}
.sh svg{color:var(--teal)}
.tagline{display:inline-flex;align-items:stretch;white-space:nowrap;max-width:100%}
.tag-inv{font:800 16px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:6px 9px 5px}
.readout{font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--ink);padding:0 10px;display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-left:0;overflow:hidden;text-overflow:ellipsis}
.dash{border:1px dashed var(--line-strong)}
.lead-v{position:absolute;left:50%;top:100%;height:27px;border-left:1px dashed var(--accent);z-index:2;pointer-events:none}
.lead-v::before{content:"";position:absolute;left:-4.5px;top:-4px;width:7px;height:7px;border:1.5px solid var(--accent);border-radius:50%;background:var(--bg)}

/* atoms */
.mono{font-family:var(--mono)} .num{font-variant-numeric:tabular-nums}
.label{font:500 11px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.tealtx{color:var(--teal)} .failtx{color:var(--fail)} .acctx{color:var(--accent)} .mutedtx{color:var(--muted)} .dimtx{color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 14px/1 var(--display);padding:11px 16px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);border-radius:0;text-decoration:none;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#ffb04f}
.btn.danger{border-color:rgba(255,106,92,.5);color:var(--fail)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.icon{padding:0;width:34px;height:34px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;border:1px solid var(--line-strong);color:var(--ink);white-space:nowrap}
.chip svg{color:var(--teal)}
.chip.acc{border-color:rgba(249,154,44,.55);color:var(--accent)} .chip.acc svg{color:var(--accent)}
.chip.fail{border-color:rgba(255,106,92,.5)} .chip.fail svg{color:var(--fail)}
.chip.mut{color:var(--muted)} .chip.mut svg{color:var(--dim)}
.sq{display:inline-block;width:10px;height:10px;border:1px solid var(--line-strong);flex:none}
.sq.f{background:var(--ink);border-color:var(--ink)} .sq.a{background:var(--accent);border-color:var(--accent)} .sq.t{background:var(--teal);border-color:var(--teal)} .sq.x{background:var(--fail);border-color:var(--fail)}
.panel{background:var(--surface);border:1px solid var(--line)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h3{margin:0;font:700 15px/1.2 var(--display);display:flex;align-items:center;gap:8px}
.gh{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.gh:hover{color:var(--accent)}
.avatar{width:30px;height:30px;display:grid;place-items:center;font:700 12px/1 var(--display);background:var(--surface-2);border:1px solid var(--line-strong);flex:none}
.avatar.fac{background:var(--bg)} .avatar.fac::after{content:"";width:9px;height:9px;background:var(--accent)}
.empty{padding:28px 18px;color:var(--muted);text-align:center;font-size:14px}
.scroll-x{overflow-x:auto}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:20px;height:64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.logo{display:flex;align-items:center;gap:10px;font:800 19px/1 var(--display);letter-spacing:-.01em;text-decoration:none;flex:none}
.logo i{width:20px;height:20px;border:2px solid var(--ink);display:grid;place-items:center}
.logo i::after{content:"";width:8px;height:8px;background:var(--accent)}
.ws-wrap{position:relative;flex:none}
.ws{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);font:500 13px/1 var(--mono);color:var(--muted);background:transparent}
.ws b{color:var(--ink);font-weight:500}
.nav{display:flex;gap:2px;overflow-x:auto;min-width:0;scrollbar-width:none}
.nav a{font:500 14px/1 var(--text);color:var(--muted);text-decoration:none;padding:9px 10px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a svg{color:var(--dim)}
.nav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.badge{font:500 11px/1 var(--mono);background:var(--accent);color:var(--accent-ink);padding:3px 6px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.pop{position:absolute;top:calc(100% + 8px);z-index:40;background:var(--surface);border:1px solid var(--line-strong);min-width:280px;box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
.pop button,.pop a{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;background:transparent;border:0;border-top:1px solid var(--line);text-align:left;text-decoration:none;font-size:14px}
.pop > :first-child{border-top:0}
.pop button:hover,.pop a:hover{background:var(--surface-2)}
main{padding-block:32px 120px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.h-display{font:800 clamp(32px,4.2vw,46px)/1.03 var(--display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.h-display .dim{color:var(--dimmer)}
.h2{font:800 26px/1.1 var(--display);letter-spacing:-.02em;margin:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
.stack{display:flex;flex-direction:column;gap:24px;min-width:0}
.tabs{display:flex;gap:0;border:1px solid var(--line-strong);width:max-content;max-width:100%;overflow-x:auto}
.tabs button{background:transparent;border:0;border-right:1px solid var(--line-strong);padding:9px 14px;font:500 12.5px/1 var(--mono);color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs button[aria-pressed="true"] svg{color:var(--bg)}

/* home */
.signoff{border:1px solid var(--accent);background:linear-gradient(180deg,var(--acc-wash),transparent 70%)}
.signoff .panel-h{border-color:rgba(249,154,44,.35)} .signoff .panel-h h3{color:var(--accent)}
.so-row{display:grid;grid-template-columns:110px minmax(0,1fr) 220px 170px;align-items:center;gap:16px;padding:14px 18px;border-top:1px solid var(--line)}
.so-row:first-child{border-top:0}
.so-row .id{font:13px/1 var(--mono);color:var(--dim)}
.so-row .t{font:700 15.5px/1.3 var(--display);text-decoration:none}
.so-row .t:hover{color:var(--accent)}
.so-row small{display:flex;align-items:center;gap:6px;font:400 13px/1.3 var(--text);color:var(--muted);margin-top:3px}
.so-row .s{font:12.5px/1.4 var(--mono);display:flex;align-items:flex-start;gap:7px}
.so-row .act{display:flex;justify-content:flex-end}
.floor-row{display:grid;grid-template-columns:210px minmax(0,1fr) 84px;gap:18px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.floor-row:first-child{border-top:0}
.floor-row .pj b{font:700 15px/1.2 var(--display)}
.floor-row .pj span{font:12px/1.4 var(--mono);color:var(--dim);display:flex;align-items:center;gap:5px;margin-top:3px}
.rail{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:relative}
.rail::before{content:"";position:absolute;left:0;right:0;top:15px;height:1px;background:var(--line-strong)}
.rail.off{opacity:.45}
.st{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.st .slot{display:flex;gap:4px;height:30px;align-items:center;padding:0 6px;background:var(--bg);position:relative;z-index:1}
.panel .st .slot{background:var(--surface)}
.st .slot a{display:block;line-height:0}
.st .slot .sq{width:12px;height:12px;transition:transform .15s}
.st .slot a:hover .sq{transform:scale(1.3)}
.st .nm{font:500 10.5px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding-left:6px}
.cost{font:500 14px/1 var(--mono);text-align:right}
.cost small{display:block;font-size:11px;color:var(--dim);margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.stat{padding:15px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat:nth-child(2n){border-right:0} .stat:nth-last-child(-n+2){border-bottom:0}
.stat .label{display:flex;align-items:center;gap:6px} .stat .label svg{color:var(--teal)}
.stat b{display:block;font:800 30px/1 var(--display);margin-top:10px;letter-spacing:-.02em}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:12px 18px;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0}
.feed .avatar{width:26px;height:26px;font-size:11px}
.feed .w{font:12px/1.4 var(--mono);color:var(--dim);display:flex;align-items:center;gap:6px;margin-top:3px}
.feed .w svg{color:var(--teal)}
.feed li.new{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--acc-wash)}to{background:transparent}}

/* board */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.kcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.kcol h4{margin:0;display:flex;justify-content:space-between;align-items:center;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:0 2px 8px;border-bottom:1px solid var(--line-strong)}
.kcard{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);padding:12px 13px;transition:border-color .15s}
.kcard:hover{border-color:var(--line-strong)}
.kcard.needs{border-color:rgba(249,154,44,.6)}
.kcard .r1{display:flex;justify-content:space-between;align-items:center;font:12.5px/1 var(--mono);color:var(--dim);gap:8px}
.kcard .tt{font:700 14.5px/1.3 var(--display);margin:8px 0 10px}
.kcard .bar{height:3px;background:var(--line)} .kcard .bar i{display:block;height:100%;background:var(--accent)}

/* runs */
.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
.tbl tr:last-child td{border-bottom:0}
.tbl td.t a{font:700 14.5px/1.3 var(--display);text-decoration:none}
.tbl td.t a:hover{color:var(--accent)}
.pips{display:flex;gap:4px}

/* run detail */
.runhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:24px}
.crumb{display:flex;align-items:center;gap:8px;font:13px/1 var(--mono);color:var(--dim);margin-bottom:14px;flex-wrap:wrap}
.crumb a{text-decoration:none} .crumb a:hover{color:var(--accent)}
.stagebox{padding:28px 28px 22px;margin-bottom:24px}
.srail{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:relative}
.srail .seg{position:relative;padding-top:26px}
.srail .seg::before{content:"";position:absolute;left:0;right:0;top:8px;height:2px;background:var(--line-strong)}
.srail .seg.done::before{background:var(--ink)}
.srail .seg.cur::before{background:linear-gradient(90deg,var(--accent) 50%,var(--line-strong) 50%)}
.srail .node{position:absolute;left:0;top:2px;width:14px;height:14px;background:var(--bg);border:1.5px solid var(--line-strong)}
.srail .done .node{background:var(--ink);border-color:var(--ink)}
.srail .cur .node{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px var(--glow)}
.srail .cur.fail .node{background:var(--fail);border-color:var(--fail);box-shadow:0 0 0 5px var(--fail-wash)}
.srail .lbl{font:500 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.srail .cur .lbl{color:var(--accent)}
.srail .ttl{font:700 16px/1.2 var(--display);margin:8px 0 4px}
.srail .todo .ttl{color:var(--dimmer)}
.srail .sub{font-size:12.5px;color:var(--muted);padding-right:12px}
.loopnote{margin-top:16px;display:inline-flex;gap:8px;align-items:center;border:1px dashed var(--accent);background:var(--acc-wash);padding:8px 12px;font:12.5px/1.3 var(--mono)}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:56px 20px minmax(0,1fr);gap:10px;padding:12px 18px;border-top:1px solid var(--line);font-size:14px;align-items:start}
.log li:first-child{border-top:0}
.log li .tm{font:12.5px/1.5 var(--mono);color:var(--dim)}
.log li svg{margin-top:2px;color:var(--teal)}
.log li.held{background:var(--acc-wash)} .log li.held .tm{color:var(--accent)} .log li.held svg{color:var(--accent)}
.log li.you svg{color:var(--accent)}
.log code,.inline-code{font:13px/1 var(--mono);background:var(--bg);border:1px solid var(--line);padding:1px 5px}
.receipt .kv{display:grid;grid-template-columns:120px minmax(0,1fr)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);margin:0}
.kv dt{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:11px 18px;border-top:1px solid var(--line);display:flex;align-items:center}
.kv dd{margin:0;padding:11px 18px;border-top:1px solid var(--line);font:13.5px/1.35 var(--mono);display:flex;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere}
.receipt .kv dt:first-of-type,.receipt .kv dd:first-of-type{border-top:0}
.receipt-acts{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-top:1px dashed var(--line-strong)}
.receipt-acts .row{display:flex;gap:10px} .receipt-acts .row .btn{flex:1}
.diff{font:12.5px/1.65 var(--mono);margin:0;padding:14px 0;overflow-x:auto;white-space:pre}
.diff span{display:block;padding:0 18px}
.diff .a{background:rgba(121,169,173,.10);color:#bfe0e2} .diff .d{background:var(--fail-wash);color:#ffb3ab} .diff .h{color:var(--dim)}
.tx{list-style:none;margin:0;padding:6px 0;font:13px/1.55 var(--mono)}
.tx li{padding:5px 18px;display:flex;gap:10px}
.tx li .k{flex:none;width:18px;color:var(--dim)}
.tx li.tool .k{color:var(--teal)} .tx li.ok .k{color:var(--teal)}

/* line editor */
.line{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-top:4px}
.stn{position:relative;padding:15px 15px 14px;border:1px solid var(--line);background:var(--surface);margin-right:14px;display:flex;flex-direction:column;gap:8px;min-height:150px;text-align:left;transition:border-color .15s}
.stn:hover{border-color:var(--line-strong)}
.stn:last-child{margin-right:0}
.stn:not(:last-child)::after{content:"";position:absolute;right:-15px;top:28px;width:14px;height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 4px,transparent 4px 7px)}
.stn .no{font:500 11px/1 var(--mono);color:var(--teal);position:absolute;right:11px;top:11px}
.stn > svg{color:var(--muted)}
.stn h4{margin:0;font:800 18px/1.1 var(--display);letter-spacing:-.01em}
.stn ul{list-style:none;margin:0;padding:0;font:12px/1.55 var(--mono);color:var(--muted);overflow-wrap:anywhere}
.stn ul li::before{content:"· ";color:var(--dim)}
.stn .dot{position:absolute;left:11px;top:-5px;width:8px;height:8px;background:var(--accent)}
.stn[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(180deg,var(--acc-wash),var(--surface))}
.stn[aria-pressed="true"] h4,.stn[aria-pressed="true"] > svg{color:var(--accent)}
.insp{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-strong)}
.insp-h{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}

(function(){

  const c=Object.assign({id,project,title,stage,status,cost:0,repairs:0,author:'sonnet-5-5',reviewer:'codex',tests:'pass',ci:'untouched',diff:'+41 −8 · 4 files',events:[]},o||{});

let S=seed();

/* ------------------------------------------------------------------ helpers */

/* ------------------------------------------------------------------ shell */

function floorRow(p){
  const r=runnerOf(p), cards=S.cards.filter(c=>c.project===p.id&&c.stage!=='merged');
  const off=!r.online;
  const cells=STAGES.map(s=>{
    const here=cards.filter(c=>c.stage===s);
    let nm=s==='pr'&&p.host==='gitlab'?'MR':ST_NAME[s]==='Pull request'?'PR':ST_NAME[s];
    const flag=here.find(c=>c.status==='repairing')?' · repair':here.find(c=>c.status==='question')?' · held':here.find(c=>c.status==='signoff')?' · sign-off':s==='todo'&&here.length?` · ${here.length}`:'';
    return `<div class="st"><span class="slot">${here.slice(0,4).map(c=>`<a href="#run-${c.id.toLowerCase()}" title="${c.id} · ${esc(c.title)}"><span class="sq ${sqFor(c)}"></span></a>`).join('')}</span><span class="nm">${nm}${flag}</span></div>`;
  }).join('');
  return `<div class="floor-row">
    <div class="pj"><a href="#board" data-act="board" data-v="${p.id}" class="gh"><b>${p.name}</b></a><span>${ic(off?'wifi-off':hostIc(p.host),'i12',off?'color:var(--fail)':'')}${r.name}${off?' <span class="failtx">offline</span>':''}</span></div>
    <div class="rail ${off?'off':''}">${cells}</div>
    <div class="cost num">${money(p.spend)}<small>${cards.length?'this week':'idle'}</small></div>
  </div>`;
}

/* run detail */
function vRun(id){
  const c=C(id); if(!c) return `<div class="empty">That run does not exist. <a href="#runs">Back to runs</a></div>`;
  const p=P(c.project), r=runnerOf(p), i=stIdx(c.stage);
  const subs={
    todo: c.status==='blocked'?'runner offline':'waiting for a cell',
    spec: c.status==='question'?'held: a question for you':c.stage==='spec'?'planner on opus':'acceptance criteria mapped',
    cell: c.stage==='cell'?'building now':'sealed, no repo token',
    gates: c.status==='repairing'?`${c.tests}, repairing on opus`:c.stage==='gates'?'running pnpm verify':'types · tests · lint',
    review: c.stage==='review'?'Codex is reading the diff':i>4?`by ${c.reviewer}, not the author`:`by ${c.reviewer}, not the author`,
    pr: c.stage==='merged'?'merged into main':c.stage==='pr'?'you sign off':'you sign off'
  };
  const segs=STAGES.map((s,k)=>{
    const st=c.stage==='merged'||k<i?'done':k===i?'cur'+(c.status==='repairing'?' fail':''):'todo';
    return `<div class="seg ${st}"><span class="node"></span><div class="lbl">${String(k+1).padStart(2,'0')} ${s==='todo'?'card':s}${k===i&&c.status==='repairing'?' · held':''}</div><div class="ttl">${ST_NAME[s]}</div><div class="sub">${subs[s]}</div></div>`;
  }).join('');
  const readout = c.stage==='merged'?'merged':`${ST_NAME[c.stage].toLowerCase()} · ${c.status==='repairing'?'repair '+c.repair+'/2':c.status}`;
  return `<div class="crumb"><a href="#runs">Runs</a>${ic('chevron-right','i12')}<a class="gh" href="https://github.com/" target="_blank" rel="noopener">${ic(hostIc(p.host),'i12')}${p.name}</a>${ic('chevron-right','i12')}<span>issue #${c.issue}</span></div>
  <div class="runhead"><div style="min-width:0"><span class="tagline" style="margin-bottom:14px"><span class="tag-inv">${c.id}</span><span class="readout">${ic('radio','i12','color:var(--teal)')}${readout} · ${r.name}</span></span>
    <h1 class="h-display" style="margin-top:14px">${esc(c.title)}</h1></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${moving(c)||c.status==='repairing'?`<button class="btn sm danger" type="button" data-act="stop" data-id="${c.id}">${ic('square','i14')}Stop run</button>`:''}${c.pr?`<a class="btn sm" href="https://github.com/" target="_blank" rel="noopener">${ic('github','i14')}PR #${c.pr}</a>`:''}</div></div>
  <div class="panel stagebox"><div class="srail">${segs}</div>
    ${c.status==='repairing'?`<div class="loopnote">${ic('wrench','i14','color:var(--accent)')}repair ${c.repair} of 2 · escalated sonnet-5-5 → opus · nothing for you to do yet</div>`:''}
    ${c.status==='question'?`<div class="loopnote">${ic('message-circle-question','i14','color:var(--accent)')}The planner asks: ${esc(c.question)}</div>`:''}
  </div>
  <div class="cols">
    <div class="panel" style="min-width:0">
      <div class="panel-h"><div class="tabs" role="group" aria-label="Run record">
        ${[['log','list','What the factory did'],['diff','file-diff','Diff'],['transcript','terminal','Transcript']].map(([k,i2,l])=>`<button type="button" data-act="runtab" data-v="${k}" aria-pressed="${S.runTab===k}">${ic(i2,'i12')}${l}</button>`).join('')}
      </div><span class="label">${c.events.length} entries</span></div>
      ${S.runTab==='log'?`<ul class="log">${c.events.map(e=>`<li class="${e.cls||''}"><span class="tm">${e.tm}</span>${ic(e.ic,'i14')}<span>${e.text}</span></li>`).join('')}</ul>`
       :S.runTab==='diff'?diffView(c):transcriptView(c)}
    </div>
    <aside>${receipt(c)}</aside>
  </div>`;
}
function receipt(c){
  const done=c.stage==='pr'||c.stage==='merged';
  const gate=c.status==='repairing'?`<span class="failtx">${c.tests}</span>`:stIdx(c.stage)>3||done?'<span class="tealtx">types · tests · lint</span>':'<span class="dimtx">not yet</span>';
  return `<div class="panel receipt ${c.status==='signoff'?'brk':''}">
    <div class="panel-h"><h3>${ic('receipt-text','i18','color:var(--teal)')}${done?'Delivery receipt':'Receipt so far'}</h3>
      ${c.stage==='merged'?`<span class="chip">${ic('git-merge','i12')}Merged</span>`:c.status==='signoff'?`<span class="chip">${ic('circle-check','i12')}Passed</span>`:`<span class="label">in progress</span>`}</div>
    <dl class="kv">
      <dt>Spec</dt><dd>sha ${(c.issue*7919).toString(16).slice(0,7)}</dd>
      <dt>Author</dt><dd>${esc(c.author)}</dd>
      <dt>Reviewer</dt><dd>${esc(c.reviewer)}${stIdx(c.stage)>=5?' · <span class="tealtx">no blockers</span>':''}</dd>
      <dt>Gates</dt><dd>${gate}</dd>
      <dt>Secret scan</dt><dd class="tealtx">${ic('shield-check','i14')}clean</dd>
      <dt>CI config</dt><dd class="${c.ci==='untouched'?'':'acctx'}">${esc(c.ci)}</dd>
      <dt>Diff</dt><dd>${esc(c.diff)}</dd>
      <dt>Cost</dt><dd class="num">${money(c.cost)}</dd>
    </dl>
    ${c.followup&&c.status==='signoff'?`<div class="note" style="margin:0 18px 16px">${ic('info','i14')}<span><b>One step after merging:</b> ${esc(c.followup)}</span></div>`:''}
    ${c.status==='signoff'?(S.changes===c.id?`<div class="receipt-acts"><div class="field"><label for="chg">What should change?</label><textarea class="inp" id="chg" placeholder="Keep the old branch name as an alias for one release."></textarea></div>
        <div class="row"><button class="btn sm" type="button" data-act="changes-cancel">Cancel</button><button class="btn sm primary" type="button" data-act="changes-send" data-id="${c.id}">${ic('send','i14')}Send back</button></div></div>`
      :`<div class="receipt-acts"><button class="btn primary" type="button" data-act="merge" data-id="${c.id}">${ic('git-merge','i14')}Merge into main</button>
        <div class="row"><button class="btn sm" type="button" data-act="changes" data-id="${c.id}">${ic('message-square','i14')}Ask for changes</button><button class="btn sm" type="button" data-act="runtab" data-v="diff">${ic('file-diff','i14')}Open diff</button></div></div>`):''}
    ${c.status==='question'?`<div class="receipt-acts"><button class="btn primary" type="button" data-act="modal" data-v="answer" data-id="${c.id}">${ic('reply','i14')}Answer the question</button></div>`:''}
  </div>`;
}
function diffView(c){
  if(stIdx(c.stage)<2) return '<div class="empty">No diff yet. The cell has not started.</div>';
  const slug=c.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,28);
  return `<pre class="diff"><span class="h">@@ src/cli/${slug}.ts @@</span><span> import { runCard } from '../run'</span><span class="d">-export async function watch(opts: WatchOpts) {</span><span class="a">+export async function watch(opts: WatchOpts, once = false) {</span><span>   const queue = await source.ready(opts)</span><span class="a">+  if (once) return runCard(queue[0], opts)</span><span>   for (const card of queue) {</span><span class="h">@@ src/cli/${slug}.test.ts @@</span><span class="a">+it('runs one issue and exits', async () =&gt; {</span><span class="a">+  await watch({ issue: 768 }, true)</span><span class="a">+  expect(runCard).toHaveBeenCalledTimes(1)</span><span class="a">+})</span></pre>`;
}
function transcriptView(c){
  if(stIdx(c.stage)<1) return '<div class="empty">No transcript yet.</div>';
  return `<ul class="tx">
    <li><span class="k">›</span><span>Reading issue #${c.issue} and the repository layout.</span></li>
    <li class="tool"><span class="k">→</span><span>read_file src/cli/watch.ts</span></li>
    <li class="tool"><span class="k">→</span><span>grep "runCard(" src/</span></li>
    <li><span class="k">›</span><span>Plan: add a one-shot path to watch, keep the loop as the default.</span></li>
    <li class="tool"><span class="k">→</span><span>edit src/cli/watch.ts (+12 −3)</span></li>
    <li class="tool"><span class="k">→</span><span>run pnpm verify</span></li>
    ${c.status==='repairing'?'<li><span class="k" style="color:var(--fail)">✗</span><span>2 failing: watch › exits after one card · watch › keeps polling</span></li>':'<li class="ok"><span class="k">✓</span><span>pnpm verify exited 0</span></li>'}
  </ul>`;
}

function s4(){const u=S.setup;const mine=u.loc==='mine';
  return `${stepHead(4,'Pick the engine and the reviewer.','Taskcell runs on the plan or API keys you already pay for. A second model reviews the first one\'s work.')}
  <div class="panel insp" style="margin-top:0">
    <div class="insp-h"><span class="tagline"><span class="tag-inv">${esc(u.engine)}</span><span class="readout">${ic('scan-eye','i12','color:var(--teal)')}reviewed by ${esc(u.reviewer)}</span></span><span class="label">${esc(u.repo)}</span></div>
    <div class="fld"><span class="lb" id="eng-l">${ic('cpu','i12')}Engine</span><div class="seg2" role="group" aria-labelledby="eng-l">${['Claude Code','Codex','Cursor'].map(o=>`<button type="button" data-act="setengine" data-v="${o}" aria-pressed="${u.engine===o}">${o}</button>`).join('')}</div><span class="hint">Writes the code inside the cell.</span></div>
    <div class="fld"><label for="rev">${ic('scan-eye','i12')}Reviewer</label><div class="selw"><select id="rev" data-act="setrev">${['Codex','Claude Code','none'].map(o=>`<option ${u.reviewer===o?'selected':''}>${o}</option>`).join('')}</select>${ic('chevron-down','i14')}</div><span class="hint">Reads the diff in a fresh context.</span></div>
    <div class="fld last" style="grid-column:1/-1"><label for="key">${ic('key-round','i12')}${u.engine==='Codex'?'OpenAI API key':u.engine==='Cursor'?'Cursor API key':'Anthropic API key'}</label>
      ${mine?`<div class="note" style="border-left-color:var(--teal);background:var(--teal-wash)">${ic('shield-check','i14','color:var(--teal)')}<span>Your key stays on <b>studio-mini</b>. Set it in the runner's environment; this page never sees it.</span></div><div class="code"><span class="c"># on studio-mini</span>\nexport ANTHROPIC_API_KEY=…   <span class="c"># read by the runner's LLM proxy</span></div>`
        :`<input class="inp" id="key" type="password" placeholder="sk-…" autocomplete="off" data-act="key"><span class="hint">Stored encrypted in our LLM proxy. The agent only ever sees a one-run nonce.</span>`}
    </div>
  </div>
  ${nextBtns(true)}`;}
function s5(){const u=S.setup;const issues=[[41,'Broken anchor links on the API page'],[44,'Add a search box to the sidebar'],[47,'Document the runner token rotation']];
  return `${stepHead(5,'Put one card through.','Label an issue <span class="mono" style="font-size:.9em">vanguard:ready</span>. The planner writes a spec first; you can read it before the build starts.')}
  <div class="repo-list">${issues.map(([n,t])=>`<div class="repo" style="cursor:default">${ic('circle-dot','i18','color:var(--teal)')}<span><b>${t}</b><br><span class="m">${u.repo} #${n} · opened by Marta</span></span><span class="tail"><button class="btn sm ${u.picked===n?'':'primary'}" type="button" data-act="pick" data-v="${n}" data-t="${esc(t)}" ${u.picked?'disabled':''}>${u.picked===n?ic('check','i14')+'Labelled':ic('tag','i14')+'Label vanguard:ready'}</button></span></div>`).join('')}</div>
  <div class="row-acts"><button class="btn" type="button" data-act="setupback">${ic('chevron-left','i14')}Back</button></div>`;}

/* modals */
function modal(){
  const m=S.modal; if(!m) return '';
  let h='',b='',f='';
  if(m.type==='answer'){const c=C(m.id);
    h=`${ic('message-circle-question','i18','color:var(--accent)')} The spec asks`;
    b=`<div class="label">${c.id} · ${P(c.project).name} · issue #${c.issue}</div><p style="margin:0;font:700 18px/1.35 var(--display)">${esc(c.question)}</p>
      <div class="field" role="radiogroup" aria-label="Answer">${['Follow the host: 50% of RAM, at most 16 GB','Keep 4 GB fixed, and make it a setting','Something else'].map((o,k)=>`<label class="radio-row"><input type="radio" name="ans" value="${esc(o)}" ${k===0?'checked':''}><span>${o}</span></label>`).join('')}</div>
      <div class="field"><label for="ansnote">Note for the planner (optional)</label><textarea class="inp" id="ansnote" placeholder="Document the default in the README."></textarea></div>
      <div class="mutedtx" style="font-size:13px;display:flex;gap:8px;align-items:center">${ic(hostIc(P(c.project).host),'i14')}Your answer is posted on the issue, so the record stays in your tracker.</div>`;
    f=`<button class="btn sm" type="button" data-act="close">Cancel</button><button class="btn sm primary" type="button" data-act="answer" data-id="${c.id}">${ic('send','i14')}Post answer and build</button>`;
  }
  if(m.type==='newcard'){
    h=`${ic('plus','i18','color:var(--accent)')} New card`;
    b=`<div class="field"><label for="nc-t">Title</label><input class="inp" id="nc-t" value="Paginate the audit log"></div>
      <div class="field"><label for="nc-p">Project</label><div class="selw"><select id="nc-p" class="inp">${S.projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>${ic('chevron-down','i14')}</div></div>
      <div class="field"><label for="nc-d">What done looks like</label><textarea class="inp" id="nc-d">The audit log loads 50 entries at a time, with a Load more button.</textarea></div>
      <label class="check"><input type="checkbox" id="nc-go" checked> Label it <span class="mono">vanguard:ready</span> so the build starts</label>
      <div class="mutedtx" style="font-size:13px;display:flex;gap:8px;align-items:center">${ic('github','i14')}Created as an issue in the project's tracker.</div>`;
    f=`<button class="btn sm" type="button" data-act="close">Cancel</button><button class="btn sm primary" type="button" data-act="newcard">${ic('plus','i14')}Create card</button>`;
  }
  if(m.type==='connect'){
    h=`${ic('plug-zap','i18','color:var(--accent)')} Connect a runner`;
    b=`<p class="mutedtx" style="margin:0">Run this on any machine with Docker and Node 24. The token works once and expires in 15 minutes.</p>
      <div class="code"><span class="c"># add --egress to turn on the allowlist</span>\nvanguard runner connect --egress \\\n  --token tcr_Lm2…9f<button class="cp" type="button" data-act="copy" data-v="vanguard runner connect --egress --token tcr_Lm29f" aria-label="Copy command">${ic('copy','i14')}</button></div>
      ${m.done?`<div class="note" style="border-left-color:var(--teal);background:var(--teal-wash)">${ic('circle-check','i14','color:var(--teal)')}<span><b>build-box</b> called in · linux/arm64 · 2 cells · egress on</span></div>`
        :`<div class="label mutedtx" style="display:flex;gap:8px;align-items:center">${ic('loader-circle','i14 spin','color:var(--accent)')}Waiting for the runner to call in…</div>`}`;
    f=m.done?`<button class="btn sm primary" type="button" data-act="close">${ic('check','i14')}Done</button>`:`<button class="btn sm" type="button" data-act="close">Cancel</button>`;
  }
  return `<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh"><div class="mh"><h2 id="mh" style="display:flex;gap:10px;align-items:center">${h}</h2><button class="btn icon" type="button" data-act="close" aria-label="Close">${ic('x','i14')}</button></div><div class="mb">${b}</div><div class="mf">${f}</div></div></div>`;
}

/* ------------------------------------------------------------------ render */
const ROUTES=['home','board','runs','line','runners','signoff','setup'];
function render(){
  const r=S.route;
  let body = r==='home'?vHome(): r==='board'?vBoard(): r==='runs'?vRuns(): r==='line'?vLine(): r==='runners'?vRunners(): r==='signoff'?vSignoff(): r==='setup'?vSetup(): r.startsWith('run-')?vRun(r.slice(4)):vHome();
  document.getElementById('app').innerHTML = topbar() + (r==='setup'?`<main style="padding:0;max-width:none">${body}</main>`:`<main>${body}</main>`) + (r==='setup'?'':protobar()) + modal();
  if(window.lucide) lucide.createIcons({attrs:{'stroke-width':1.75}});
  S.feed.forEach(f=>f.fresh=false);
}
function go(){
  const h=(location.hash||'#home').slice(1);
  S.route = ROUTES.includes(h)||(h.startsWith('run-')&&C(h.slice(4)))?h:'home';
  S.pop=null; S.changes=null;
  if(S.route.startsWith('run-')) S.runTab='log';
  if(S.route==='setup') setupTimers();
  render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange',go);

/* ------------------------------------------------------------------ toasts */
function toast(text,kind,icon){
  const el=document.createElement('div');
  el.className='toast '+(kind||'');
  el.innerHTML=`${ic(icon||'circle-check','i14')}<span>${text}</span>`;
  const box=document.getElementById('toasts'); box.appendChild(el);
  while(box.children.length>3) box.firstChild.remove();
  if(window.lucide) lucide.createIcons({attrs:{'stroke-width':1.75}});
  setTimeout(()=>el.remove(),3800);
}
function feed(who,text,meta,icon){S.feed.unshift({who,text,meta,icon,fresh:true});}

/* ------------------------------------------------------------------ factory */
function tick(){
  S.clock+=3; const t=fmt(S.clock);
  const startedTodo=new Set(), opened=[]; let moved=0;
  const order=[...S.cards].sort((a,b)=>stIdx(b.stage)-stIdx(a.stage));
  for(const c of order){
    if(c.stage==='merged'||needsYou(c)) continue;
    if(c.stage!=='todo'&&moved>=2) continue;
    const p=P(c.project), r=runnerOf(p);
    if(!r.online){ if(c.stage==='todo') c.status='blocked'; continue; }
    const add=(ic2,text,cls)=>c.events.push({tm:t,ic:ic2,text,cls});
    if(c.stage!=='todo') moved++;
    if(c.status==='repairing'){
      c.status='running'; c.stage='review'; c.tests='pass'; c.cost+=0.42;
      add('circle-check',`Repair ${c.repair} on opus fixed both tests. All gates green. Sent to review.`);
      continue;
    }
    if(c.stage==='todo'){
      if(startedTodo.has(p.id)) continue; startedTodo.add(p.id);
      c.stage='spec'; c.status='running'; c.cost+=0.18;
      add('file-text','A planner is reading the code and writing the spec.'); continue;
    }
    if(c.stage==='spec'){c.stage='cell';c.cost+=0.35;add('box','Spec posted on the issue. Building in a sealed cell.');continue;}
    if(c.stage==='cell'){
      c.stage='gates'; c.cost+=0.5;
      if(c.willFail){c.willFail=false;c.status='repairing';c.repair=1;c.tests='1 failing';c.author='sonnet-5-5 → opus';S.stats.repairs++;
        add('circle-x','<b>Held at gates.</b> <code>pnpm test</code>: 1 failing. Repair 1 of 2 runs on opus.','held');
        feed('TC',`${c.id} held at gates, repairing on its own`,`${p.name} · ${t}`,'wrench');}
      else add('list-checks','Running <code>pnpm verify</code> and the secret scan.');
      continue;
    }
    if(c.stage==='gates'){c.stage='review';add('circle-check','Gates passed: types, tests, lint. Secret scan clean.');continue;}
    if(c.stage==='review'){
      c.stage='pr'; c.status='signoff'; c.pr=c.pr||S.nextPr++; c.cost+=0.21;
      add('git-pull-request',`Review on ${c.reviewer}: no blockers. The host opened PR #${c.pr}.`);
      feed('TC',`Opened <b>PR #${c.pr}</b>: ${esc(c.title)}`,`${p.name} · ${t}`,'git-pull-request');
      opened.push(c.pr);
    }
  }
  if(opened.length) toast(`PR #${opened.join(', #')} ${opened.length>1?'are':'is'} ready for your sign-off`,'acc','stamp');
  S.stats.spend=+(S.stats.spend+0.9).toFixed(2);
  S.projects.forEach(p=>{if(S.cards.some(c=>c.project===p.id&&moving(c))) p.spend=+(p.spend+0.3).toFixed(2);});
  render();
}
let autoT=null;
function setAuto(on){S.auto=on;clearInterval(autoT);if(on) autoT=setInterval(tick,5000);render();}

/* setup timers */
let ghT=null,runT=null;
function setupTimers(){
  const u=S.setup;
  if(u.step===3&&u.loc==='mine'&&!u.runnerUp&&!runT) runT=setTimeout(()=>{runT=null;if(S.route==='setup'&&S.setup.step===3&&S.setup.loc==='mine'){S.setup.runnerUp=true;toast('studio-mini called in','', 'radio');render();}},2600);
}

/* ------------------------------------------------------------------ actions */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) { if(S.pop){S.pop=null;render();} return; }
  const a=el.dataset.act, v=el.dataset.v, id=el.dataset.id;
  if(a!=='pop'&&a!=='noop'&&S.pop&&!el.closest('.pop')) S.pop=null;
  switch(a){
    case 'pop': S.pop=S.pop===v?null:v; render(); break;
    case 'noop': S.pop=null; render(); break;
    case 'toast': S.pop=null; toast(esc(v),'', 'info'); render(); break;
    case 'tick': tick(); break;
    case 'auto': setAuto(!S.auto); break;
    case 'reset': clearInterval(autoT); S=seed(); location.hash='#home'; render(); toast('Prototype reset to the sample data','', 'rotate-ccw'); break;
    case 'modal': S.pop=null; S.modal={type:v,id}; render();
      if(v==='connect') setTimeout(()=>{ if(S.modal&&S.modal.type==='connect'&&!S.modal.done){S.modal.done=true; if(!R('build-box')) S.runners.push({id:'build-box',name:'build-box',kind:'own',os:'linux/arm64',ver:'1.14.0',cells:2,online:true,egress:true,seen:'1 s',icon:'server'}); feed('PK','You connected the runner <b>build-box</b>','acme · just now','plug-zap'); render();}},2400);
      break;
    case 'scrim': if(e.target===el){S.modal=null;render();} break;
    case 'close': S.modal=null; render(); break;
    case 'answer': {
      const c=C(id), ans=(document.querySelector('input[name="ans"]:checked')||{}).value||'', note=(document.getElementById('ansnote')||{}).value||'';
      c.status='running'; c.stage='cell'; S.stats.stepped++;
      c.events.push({tm:fmt(S.clock),ic:'message-circle-reply',cls:'you',text:`You answered: <b>${esc(ans)}</b>${note?` · “${esc(note)}”`:''}. Spec updated; building in a sealed cell.`});
      feed('PK',`You answered the spec question on <b>#${c.issue}</b>`,`${P(c.project).name} · just now`,'message-circle-reply');
      S.modal=null; render(); toast(`Answer posted on #${c.issue}. The build has started.`);
      break; }
    case 'newcard': {
      const t=document.getElementById('nc-t').value.trim()||'Untitled card', pid=document.getElementById('nc-p').value, goNow=document.getElementById('nc-go').checked;
      const n=S.nextId++; const c=card('TC-0'+n,pid,t,'todo','queued',{issue:n});
      if(goNow&&runnerOf(P(pid)).online){c.stage='spec';c.status='running';c.events.push({tm:fmt(S.clock),ic:'file-text',text:'A planner is reading the code and writing the spec.'});}
      else if(!runnerOf(P(pid)).online) c.status='blocked';
      S.cards.push(c); feed('PK',`You created <b>${c.id}</b>: ${esc(t)}`,`${P(pid).name} · just now`,'plus');
      S.modal=null; render(); toast(`${c.id} created${c.stage==='spec'?' and on the line':''}`);
      break; }
    case 'board': if(el.tagName==='A') e.preventDefault(); S.boardProject=v; if(S.route!=='board') location.hash='#board'; else render(); break;
    case 'runsf': S.runsFilter=v; render(); break;
    case 'runtab': S.runTab=v; render(); break;
    case 'merge': {
      const c=C(id); c.stage='merged'; c.status='merged'; S.stats.merged++;
      c.events.push({tm:fmt(S.clock),ic:'git-merge',cls:'you',text:`You merged PR #${c.pr} into main from its receipt.`});
      feed('PK',`You merged <b>PR #${c.pr}</b> from its receipt`,`${P(c.project).name} · just now`,'git-merge');
      render(); toast(`Merged PR #${c.pr} into main`,'', 'git-merge'); break; }
    case 'changes': S.changes=id; render(); setTimeout(()=>{const t=document.getElementById('chg');t&&t.focus();},0); break;
    case 'changes-cancel': S.changes=null; render(); break;
    case 'changes-send': {
      const c=C(id), txt=(document.getElementById('chg').value||'').trim()||'Small fixes, see the PR comment.';
      c.stage='cell'; c.status='running'; S.changes=null; S.stats.stepped++;
      c.events.push({tm:fmt(S.clock),ic:'message-square',cls:'you',text:`You asked for changes: “${esc(txt)}”. The card went back to a cell for a revision.`});
      feed('PK',`You asked for changes on <b>PR #${c.pr}</b>`,`${P(c.project).name} · just now`,'rotate-ccw');
      render(); toast('Sent back for a revision. It returns here when the gates pass.','acc','rotate-ccw'); break; }
    case 'stop': {
      const c=C(id); c.stage='todo'; c.status='queued';
      c.events.push({tm:fmt(S.clock),ic:'square',cls:'you',text:'You stopped the run. The worktree and partial diff are kept; the card is back in Todo.'});
      render(); toast(`${c.id} stopped. Partial work is kept.`,'acc','square'); break; }
    case 'station': S.lineStation=v; render(); break;
    case 'fieldv': {
      const L=S.lines[S.lineProject]; if(!L.draft) L.draft=JSON.parse(JSON.stringify(L.cfg));
      const cur=L.draft[S.lineStation][el.dataset.k]; L.draft[S.lineStation][el.dataset.k]= typeof cur==='boolean'? v==='true': v;
      if(!changes(L).length) L.draft=null; render(); break; }
    case 'discard': S.lines[S.lineProject].draft=null; render(); toast('Draft discarded','', 'undo-2'); break;
    case 'publish': {
      const L=S.lines[S.lineProject], ch=changes(L);
      L.cfg=L.draft; L.draft=null; L.v++;
      const nice=ch.length===1?`${ch[0][0]} → ${show(ch[0][2])}`:`${ch.length} changes`;
      L.history.unshift({v:L.v,who:'You',when:'now',text:nice,diff:ch});
      if(ch.find(x=>x[0]==='cell.runner')){const p=P(S.lineProject);const nr=S.runners.find(r=>r.name===L.cfg.cell.runner);if(nr){p.runner=nr.id;S.cards.filter(c=>c.project===p.id&&c.status==='blocked').forEach(c=>c.status='queued');}}
      feed('PK',`You published line v${L.v}: ${esc(nice)}`,`${P(S.lineProject).name} · just now`,'workflow');
      render(); toast(`Line v${L.v} published. The next card uses it.`,'', 'upload'); break; }
    case 'runner': S.selRunner=v; render(); break;
    case 'move-web': {
      const p=P('web'); p.runner='home-server'; S.lines.web.cfg.cell.runner='home-server'; S.lines.web.v++;
      S.lines.web.history.unshift({v:S.lines.web.v,who:'You',when:'now',text:'Moved to home-server',diff:[['cell.runner','pawel-mbp','home-server']]});
      S.cards.filter(c=>c.project==='web'&&c.status==='blocked').forEach(c=>c.status='queued');
      feed('PK','You moved <b>acme/web</b> to home-server','acme/web · line v'+S.lines.web.v+' · just now','arrow-right-left');
      render(); toast('acme/web now runs on home-server. Its 2 cards start on the next step.','', 'arrow-right-left'); break; }
    case 'copy': e.preventDefault(); e.stopPropagation();
      try{navigator.clipboard.writeText(v).then(()=>toast('Command copied','', 'copy'),()=>toast('Copy failed. Select the command instead.','acc','copy'));}catch(_){toast('Copy failed. Select the command instead.','acc','copy');}
      break;
    /* setup */
    case 'gh': S.setup.gh='wait'; render(); setTimeout(()=>{S.setup.gh='yes';render();toast('Taskcell App installed on acme','', 'github');},1300); break;
    case 'repo': S.setup.repo=v; render(); break;
    case 'setengine': S.setup.engine=v; render(); break;
    case 'setupnext': S.setup.step=Math.min(5,S.setup.step+1); render(); setupTimers(); window.scrollTo(0,0); break;
    case 'setupback': S.setup.step=Math.max(1,S.setup.step-1); render(); window.scrollTo(0,0); break;
    case 'setupgo': S.setup.step=+v; render(); setupTimers(); break;
    case 'pick': {
      const u=S.setup; u.picked=+v; render();
      const mine=u.loc==='mine';
      if(mine&&!R('studio-mini')) S.runners.push({id:'studio-mini',name:'studio-mini',kind:'own',os:'darwin/arm64',ver:'1.14.0',cells:2,online:true,egress:true,seen:'2 s',icon:'monitor'});
      if(!P('docs')){S.projects.push({id:'docs',name:u.repo,host:'github',runner:mine?'studio-mini':'taskcell',spend:0});
        const L=freshLine(mine?'studio-mini':'Taskcell cells'); L.v=1; L.history=[{v:1,who:'You',when:'now',text:'First line',diff:[]}]; L.cfg.cell.engine=u.engine; L.cfg.review.engine=u.reviewer; L.cfg.gates.verify='pnpm test'; S.lines.docs=L;}
      const n=S.nextId++; const c=card('TC-0'+n,'docs',el.dataset.t,'spec','running',{issue:+v,cost:0.12,author:u.engine==='Claude Code'?'sonnet-5-5':u.engine.toLowerCase(),reviewer:u.reviewer.toLowerCase()});
      c.events=[{tm:fmt(S.clock),ic:'tag',text:`Issue #${v} labelled <code>vanguard:ready</code>.`},{tm:fmt(S.clock),ic:'file-text',text:'A planner is reading the code and writing the spec.'}];
      S.cards.push(c); feed('PK',`You set up <b>${u.repo}</b>. ${c.id} is on the line`,`${u.repo} · just now`,'rocket');
      setTimeout(()=>{S.setup=freshSetup(); location.hash='#home'; toast(`${u.repo} is live. ${c.id} is on the line.`,'acc','rocket');},900);
      break; }
  }
});
document.addEventListener('change',e=>{
  const el=e.target, a=el.dataset&&el.dataset.act;
  if(a==='field'){const L=S.lines[S.lineProject]; if(!L.draft) L.draft=JSON.parse(JSON.stringify(L.cfg)); L.draft[S.lineStation][el.dataset.k]=el.value; if(!changes(L).length) L.draft=null; render();}
  if(a==='lineproj'){S.lineProject=el.value; render();}
  if(a==='loc'){S.setup.loc=el.value; render(); setupTimers();}
  if(a==='setrev'){S.setup.reviewer=el.value; render();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(S.modal||S.pop)){S.modal=null;S.pop=null;render();}
  if(e.target.matches&&e.target.matches('.rtab tr')&&e.key==='Enter'){S.selRunner=e.target.dataset.v;render();}
});

go();
})();
</script>
