[package]
name = "desktop"
version = "0.1.0"
description = "Taskcell Inspector"
edition = "2021"
# The minimum the locked dependencies declare (tauri 2.12, tauri-plugin-updater 2.14).
rust-version = "1.90"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.1"

# A floor for the updater's own Windows-only zip, which it accepts at any 9.x: below 9.0.5 is GHSA-m665-v7pm-7grj.
# Drop when the updater leaves zip 9 (this entry would keep an unused zip 9.x in the Windows build).
# Unused directly; default-features = false adds nothing to what the updater enables.
[target.'cfg(target_os = "windows")'.dependencies]
zip = { version = "9.0.5", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
