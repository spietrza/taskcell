name: Taskcell Revise

# Thin caller of the reusable workflow (revise.yml), which holds the steps.

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr: { description: "PR number", required: true }

permissions:
  contents: write          # pushes the revision commit to the PR branch
  pull-requests: write     # reply, resolve threads, gh pr ready
  issues: write

jobs:
  revise:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'needs revision' &&
       contains(fromJSON('["spietrza","github-actions[bot]","pawelkrystkiewicz"]'), github.event.pull_request.user.login) &&
       contains(fromJSON('["spietrza","pawelkrystkiewicz"]'), github.event.sender.login))
    # Job-level and per PR: skipped label events never enter a group, and a revision of one PR no
    # longer waits behind (or cancels the pending revision of) another PR.
    concurrency:
      group: taskcell-revise-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: false
    uses: ./.github/workflows/revise.yml
    with:
      allowed-actors: '["spietrza","pawelkrystkiewicz"]'
      number: ${{ github.event.pull_request.number || inputs.pr }}
      llm-proxy: true
      upload-run-records: true
      sandbox-memory-mb: '8192'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # PAT for revision pushes: GITHUB_TOKEN events fire no workflows (recursion guard), so
      # revised PRs would never get CI and stay BLOCKED under branch protection (#256).
      VANGUARD_PUSH_TOKEN: ${{ secrets.VANGUARD_PUSH_TOKEN }}
