name: Taskcell PR Review (reusable)

# Reusable body of the external PR review: a visible, adversarial `gh pr review` on a labelled PR.
# A caller owns the triggers (`pull_request_target` labeled + `workflow_dispatch`), `permissions`
# (contents: read, pull-requests: write, issues: write), `concurrency` and its own `if:`.
# See docs/onboarding-another-repo.md.

on:
  workflow_call:
    inputs:
      allowed-actors:
        description: 'JSON array of GitHub logins allowed to trigger this workflow, e.g. ["octocat"]. Enforced here as a backstop to the caller if:.'
        type: string
        required: true
      review-concurrency:
        description: 'How many labelled PRs one run reviews in parallel (--concurrency). Empty = CLI default (2).'
        type: string
        default: ''
      provider:
        description: 'Review provider (--provider), e.g. codex or claude. Empty = CLI default.'
        type: string
        default: ''
      review-model:
        description: 'Review model (--review-model). Empty = CLI default.'
        type: string
        default: ''
      fallback-provider:
        description: 'Provider to retry the review with when the first attempt exits non-zero (e.g. Codex limit or bad model). Empty = no fallback. Preflighted: a fallback whose credential is missing is disabled with a warning (never a red job); any other preflight failure, e.g. an unknown provider name, fails the run. The retry keeps the event hint, so the just-labeled PR is found even when the label search lags; a head the first attempt already reviewed no longer carries the trigger label and is skipped.'
        type: string
        default: ''
      fallback-model:
        description: 'Review model for the fallback attempt.'
        type: string
        default: ''
      author:
        description: 'Only review PRs opened by this login (--author). Empty = any author the CLI accepts.'
        type: string
        default: ''
      sandbox-readonly:
        description: 'Run the sandbox with a read-only root filesystem (VANGUARD_SANDBOX_READONLY=1). Off by default; it raises the default sandbox memory to 8192 MB because the writable paths become tmpfs.'
        type: boolean
        default: false
      llm-proxy:
        description: 'Keep the model credential in a sidecar proxy, out of the sandbox (--llm-proxy). Not usable with a Codex subscription.'
        type: boolean
        default: false
      skills:
        description: 'Skills directory (--skills), relative to the workspace.'
        type: string
        default: .vanguard-src/skills
      vanguard-ref:
        description: 'Vanguard source ref to build. Empty = the ref this workflow was called at.'
        type: string
        default: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      CODEX_AUTH_JSON:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      # A caller repo with its own `packageManager` (e.g. pnpm@9) would make `pnpm store path` (setup-node's
      # cache key) run under that version while the install in .vanguard-src uses Vanguard's; the paths then
      # differ and the cache post-step fails. Keep the action-provided pnpm everywhere.
      npm_config_manage_package_manager_versions: "false"
    steps:
      # A JSON string ('"octocat"') would turn contains() into a substring match; only an array is accepted.
      - name: Check allowed-actors shape
        if: ${{ !startsWith(inputs.allowed-actors, '[') }}
        run: echo "::error::allowed-actors must be a JSON array, e.g. '[\"octocat\"]'" && exit 1

      # Backstop to the caller's if:. A step, not a job-level if:, so a wrong or stale login list fails
      # the run loudly instead of skipping the job and reporting the caller green.
      - name: Enforce allowed-actors
        if: ${{ !contains(fromJSON(inputs.allowed-actors), github.event.sender.login || github.actor) }}
        env:
          ACTOR: ${{ github.event.sender.login || github.actor }}
        run: echo "::error::actor '$ACTOR' is not in allowed-actors" && exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Fail loudly rather than let actions/checkout silently build the default branch.
      - name: Resolve vanguard source ref
        if: ${{ inputs.vanguard-ref == '' && (job.workflow_sha == '' || job.workflow_repository == '') }}
        run: echo "::error::inputs.vanguard-ref is empty and job.workflow_sha / job.workflow_repository did not resolve" && exit 1

      # The vanguard source is checked out at the ref of this workflow, so a caller pinned @v1 builds
      # the CLI at the same revision as the YAML.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository || 'spietrza/taskcell' }}   # the repo that holds THIS reusable workflow (a fork builds itself)
          ref: ${{ inputs.vanguard-ref || job.workflow_sha }}
          path: .vanguard-src

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: .vanguard-src/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: .vanguard-src/pnpm-lock.yaml

      # --ignore-scripts skips esbuild's postinstall (pnpm.onlyBuiltDependencies); fine because only `pnpm build`
      # (tsc + cp) and `node dist/` run here. Anything invoking tsx/vitest from .vanguard-src would need it.
      - run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts
        working-directory: .vanguard-src

      - run: pnpm build
        working-directory: .vanguard-src

      - name: Build sandbox image
        # Pulls ghcr.io/spietrza/taskcell-sandbox for this docker/ tree when its build provenance verifies, else builds.
        env:
          GH_TOKEN: ${{ github.token }}
        run: .vanguard-src/docker/build.sh

      - name: Ensure routing labels
        run: |
          # A repository that already has the old `vanguard:` spelling keeps it (`taskcell migrate-labels` renames in
          # place, and a twin under the new name would stop that rename); a repository without it gets `taskcell:`.
          state_label() {
            local name="$1" existing; shift
            existing=$(gh label list --repo "$GITHUB_REPOSITORY" --limit 1000 --json name --jq '.[].name')
            if printf '%s\n' "$existing" | grep -qixF "vanguard:$name"; then
              gh label create "vanguard:$name" --repo "$GITHUB_REPOSITORY" "$@" --force
            else
              gh label create "taskcell:$name" --repo "$GITHUB_REPOSITORY" "$@" --force
            fi
          }
          gh label create "ready for vanguard review" --repo "$GITHUB_REPOSITORY" --color BFD4F2 --description "Trigger a Vanguard PR review" --force
          state_label reviewing --color FBCA04 --description "Taskcell PR review in progress"
          state_label reviewed --color 0E8A16 --description "Taskcell PR review posted"

      - name: Preflight
        id: preflight
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          IN_PROVIDER: ${{ inputs.provider }}
          IN_FALLBACK_PROVIDER: ${{ inputs.fallback-provider }}
          IN_LLM_PROXY: ${{ inputs.llm-proxy }}
          IN_SANDBOX_READONLY: ${{ inputs.sandbox-readonly }}
        run: |
          preflight() {
            local args=(doctor-prs --github-repo "$GITHUB_REPOSITORY" --label "ready for vanguard review" --repo "$GITHUB_WORKSPACE")
            [ -n "$1" ] && args+=(--provider "$1")
            [ "$IN_LLM_PROXY" = "true" ] && args+=(--llm-proxy)
            if [ "$IN_SANDBOX_READONLY" = "true" ]; then export VANGUARD_SANDBOX_READONLY=1; fi
            node .vanguard-src/dist/cli/index.js "${args[@]}"
          }
          preflight "$IN_PROVIDER"
          # The fallback is only useful if its credential is in place before the first attempt fails — but a
          # fallback whose credential is missing must not take the primary down with it (a caller with a
          # Codex primary and an unset Claude secret would otherwise go red before Codex ever ran). Warn,
          # note it in the run summary and review without the fallback instead.
          fallback_ok=false
          if [ -n "$IN_FALLBACK_PROVIDER" ]; then
            if out=$(preflight "$IN_FALLBACK_PROVIDER" 2>&1); then
              printf '%s\n' "$out"
              fallback_ok=true
            else
              printf '%s\n' "$out"
              # Only a missing credential degrades to "no fallback". Any other failing check (unknown provider
              # name, malformed CODEX_AUTH_JSON, gh/label/sandbox trouble) is a caller mistake or an outage and
              # stays fatal, exactly as for the primary.
              cred_re='^preflight: (llm auth missing|provider auth .* in the environment\.) -> stop before claim'
              missing_cred=$(printf '%s\n' "$out" | grep -Ec "$cred_re" || true)
              other_fail=$(printf '%s\n' "$out" | grep -- '-> stop before claim' | grep -Evc "$cred_re" || true)
              if [ "$missing_cred" -eq 0 ] || [ "$other_fail" -ne 0 ]; then
                echo "::error::fallback provider '$IN_FALLBACK_PROVIDER' failed preflight for a reason other than a missing credential (see above)"
                exit 1
              fi
              echo "::warning::fallback provider '$IN_FALLBACK_PROVIDER' has no credential in this repo; reviewing without a fallback"
              echo "Fallback provider \`$IN_FALLBACK_PROVIDER\` disabled for this run: credential missing (see the Preflight step)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "fallback-ok=$fallback_ok" >> "$GITHUB_OUTPUT"

      # `watch-prs` has no provider fallback of its own (only the implement pipeline's review stage does),
      # so when a fallback is configured the review is retried here with the fallback provider and model.
      - name: Review labeled PRs
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          IN_PROVIDER: ${{ inputs.provider }}
          IN_REVIEW_MODEL: ${{ inputs.review-model }}
          IN_FALLBACK_PROVIDER: ${{ inputs.fallback-provider }}
          IN_FALLBACK_MODEL: ${{ inputs.fallback-model }}
          IN_FALLBACK_OK: ${{ steps.preflight.outputs.fallback-ok }}
          IN_AUTHOR: ${{ inputs.author }}
          IN_LLM_PROXY: ${{ inputs.llm-proxy }}
          IN_SANDBOX_READONLY: ${{ inputs.sandbox-readonly }}
          IN_SKILLS: ${{ inputs.skills }}
          IN_CONCURRENCY: ${{ inputs.review-concurrency }}
          IN_ALLOWED_ACTORS: ${{ inputs.allowed-actors }}
        run: |
          # Allowed actors also count as trusted PR authors (repo members always do).
          feedback_authors=$(jq -r 'join(",")' <<<"$IN_ALLOWED_ACTORS")
          run_review() {
            local provider="$1" model="$2"
            local args=(watch-prs --once --github-repo "$GITHUB_REPOSITORY"
              --label "ready for vanguard review"
              --reviewing-label "taskcell:reviewing"
              --reviewed-label "taskcell:reviewed"
              --repo "$GITHUB_WORKSPACE")
            [ -n "$IN_SKILLS" ] && args+=(--skills "$IN_SKILLS")
            [ -n "$IN_CONCURRENCY" ] && args+=(--concurrency "$IN_CONCURRENCY")
            [ -n "$IN_AUTHOR" ] && args+=(--author "$IN_AUTHOR")
            [ -n "$feedback_authors" ] && args+=(--feedback-authors "$feedback_authors")
            [ -n "$provider" ] && args+=(--provider "$provider")
            [ -n "$model" ] && args+=(--review-model "$model")
            [ "$IN_LLM_PROXY" = "true" ] && args+=(--llm-proxy)
            if [ "$IN_SANDBOX_READONLY" = "true" ]; then export VANGUARD_SANDBOX_READONLY=1; fi
            node .vanguard-src/dist/cli/index.js "${args[@]}"
          }
          if [ -n "$IN_FALLBACK_PROVIDER" ] && [ "$IN_FALLBACK_OK" = "true" ]; then
            # The fallback keeps the event hint. Without it the retry relied on the label scan, which lagged
            # behind the label restore the failed attempt had just made and returned "0 ready": the fallback
            # reviewed nothing, exited 0, and the job went green with no review on the PR (alpha-window run
            # 37902049649). The hint cannot double-post: a PR the first attempt reviewed has had the trigger
            # label swapped for the reviewed label, so the hinted fetch skips it. Residual: a review that was
            # posted but whose label edit then failed gets a second review — accepted over a silent green job.
            run_review "$IN_PROVIDER" "$IN_REVIEW_MODEL" || run_review "$IN_FALLBACK_PROVIDER" "$IN_FALLBACK_MODEL"
          else
            run_review "$IN_PROVIDER" "$IN_REVIEW_MODEL"
          fi
