name: release-please

on:
  push:
    branches: [main]

permissions: {} # each job declares what it needs (OpenSSF Scorecard Token-Permissions)

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # The release PR is opened by the taskcell App bot, like factory PRs. An App token also fires
      # workflows (a GITHUB_TOKEN-opened PR gets no CI). Merging it still needs Seba's explicit go.
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.TASKCELL_APP_CLIENT_ID }}
          private-key: ${{ secrets.TASKCELL_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
