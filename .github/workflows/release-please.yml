name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # PAT: a PR opened with GITHUB_TOKEN fires no workflows, so the release PR got no CI.
          token: ${{ secrets.VANGUARD_PUSH_TOKEN }}
