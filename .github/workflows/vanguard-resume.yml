name: Vanguard Resume

# Brings factory work back after a provider rate or session limit (#682). A run that ends on such a limit
# marks the issue/PR with `vanguard:rate-limited` and a reset time; this sweep re-adds the trigger label
# once that time has passed. It runs on the PAT: a label added with GITHUB_TOKEN starts no workflow.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vanguard-resume-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resume:
    if: github.event_name == 'schedule' || github.actor == 'spietrza'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm

      # --ignore-scripts: only `pnpm build` (tsc + cp) and `node dist/` run here.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm build

      - name: Resume rate-limited work
        env:
          GH_TOKEN: ${{ secrets.VANGUARD_PUSH_TOKEN }}
        run: node dist/cli/index.js resume-rate-limited --github-repo "$GITHUB_REPOSITORY"
