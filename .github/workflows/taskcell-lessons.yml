name: Taskcell Lessons

# Per-PR lesson (#765): when a factory PR closes, distil 0-3 lessons from its history (blocking reviews,
# revise rounds, verify failures), append them to lessons.jsonl on the taskcell-metrics branch and comment
# them on the PR. A clean first-round merge records nothing and makes no model call. Later implement runs
# read the relevant lessons into their retrospective memory.
#
# Trust: pull_request_target runs the default branch's copy of this file and checks out the base branch,
# never PR code. Only trusted authors' comments reach the model, which runs with every tool disabled.

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr: { description: "PR number", required: true }

permissions:
  contents: write        # append lessons.jsonl to the taskcell-metrics branch
  pull-requests: write   # the Lesson comment
  issues: write

jobs:
  lesson:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'spietrza') ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'chore/vanguard-') || startsWith(github.event.pull_request.head.ref, 'chore/taskcell-')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: taskcell-lessons-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts && pnpm build

      - name: Record the lesson
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IN_PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          [[ "$IN_PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr must be a positive integer, got '$IN_PR'"; exit 1; }
          node dist/cli/index.js lessons record --pr "$IN_PR" --github-repo "$GITHUB_REPOSITORY" --feedback-authors spietrza,pawelkrystkiewicz
