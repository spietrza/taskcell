name: Taskcell Research

# Thin caller of the reusable workflow (research.yml), which holds the steps.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue: { description: "issue number", required: true }

permissions: {} # each job declares what it needs (OpenSSF Scorecard Token-Permissions)

concurrency:
  group: taskcell-research-${{ github.repository }}
  cancel-in-progress: false

jobs:
  research:
    permissions:
      contents: read
      issues: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'needs research' &&
       contains(fromJSON('["spietrza","pawelkrystkiewicz"]'), github.event.issue.user.login) &&
       contains(fromJSON('["spietrza","pawelkrystkiewicz"]'), github.event.sender.login))
    uses: ./.github/workflows/research.yml
    with:
      allowed-actors: '["spietrza","pawelkrystkiewicz"]'
      number: ${{ github.event.issue.number || inputs.issue }}
      provider: claude
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
