name: Desktop release
# Builds the Taskcell Desktop installers (macOS arm64 + x64, Windows, Linux) with the bundled hub and
# replaces the assets of the rolling `desktop-latest` release, which the docs and the landing page link to.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (default: version in package.json)'
        required: false
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    # Builds only from the default branch or a release tag, never from PR code: the job holds signing secrets.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install
        shell: bash
        run: pnpm install --frozen-lockfile && pnpm --dir apps/desktop install --frozen-lockfile
      - name: Build installers
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization with an App Store Connect API key (role Developer) instead of APPLE_ID/APPLE_PASSWORD.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          version="${INPUT_VERSION:-$(node -p "require('./package.json').version")}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "invalid version: $version"; exit 1; fi
          # Unset secrets are empty strings; Tauri would try to use them, so drop them and build unsigned.
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -n "${APPLE_API_KEY_P8:-}" ] && [ -n "${APPLE_API_KEY:-}" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            (umask 077; printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH")
          else
            unset APPLE_API_ISSUER APPLE_API_KEY
          fi
          unset APPLE_API_KEY_P8
          # prepare-sidecar signs the Mach-O files in the hub resources before Tauri runs, so the certificate has to be
          # in a keychain already; Tauri then signs from that keychain by APPLE_SIGNING_IDENTITY.
          if [ "$RUNNER_OS" = macOS ] && [ -n "${APPLE_CERTIFICATE:-}" ]; then
            kc="$RUNNER_TEMP/build.keychain-db"
            kcpw=$(openssl rand -hex 16)
            security create-keychain -p "$kcpw" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kcpw" "$kc"
            (umask 077; printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12")
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "${APPLE_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" > /dev/null
            # shellcheck disable=SC2046
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          fi
          updater=false
          [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && updater=true
          # Linux ships .deb only: linuxdeploy (AppImage) runs ldd on every ELF in the bundled hub's node_modules
          # and aborts on the Claude Agent SDK's binary.
          bundles=()
          [ "$RUNNER_OS" = Linux ] && bundles=(--bundles deb)
          cd apps/desktop
          pnpm bundle --verbose "${bundles[@]}" --config "{\"version\":\"$version\",\"bundle\":{\"createUpdaterArtifacts\":$updater}}" -- --locked
      # The bundled hub must load from inside the app (a dropped node_modules once shipped an app whose hub never started).
      - name: Smoke-test the bundled hub
        if: runner.os == 'macOS'
        shell: bash
        run: |
          apps=(apps/desktop/src-tauri/target/release/bundle/macos/*.app)
          app="${apps[0]}"
          "$app/Contents/MacOS/node" "$app/Contents/Resources/taskcell/dist/cli/index.js" --help > /dev/null
          # Under the hardened runtime V8 dies at start without JIT; a runner can still run the binary, so check the entitlement.
          if codesign -dv "$app/Contents/MacOS/node" 2>&1 | grep -q '(runtime)'; then
            codesign -d --entitlements - "$app/Contents/MacOS/node" 2>&1 | grep -q 'com.apple.security.cs.allow-jit'
          fi
      - name: Collect installers
        shell: bash
        env:
          TARGET: ${{ matrix.name }}
        run: |
          mkdir -p out
          bundle=apps/desktop/src-tauri/target/release/bundle
          for f in "$bundle"/dmg/*.dmg "$bundle"/msi/*.msi "$bundle"/nsis/*.exe "$bundle"/deb/*.deb \
                   "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig "$bundle"/msi/*.sig "$bundle"/nsis/*.sig; do
            [ -f "$f" ] && cp "$f" out/
          done
          # Both macOS runners name the updater archive the same; tag it with the architecture.
          for f in out/*.app.tar.gz*; do [ -f "$f" ] && mv "$f" "${f/.app.tar.gz/_${TARGET}.app.tar.gz}"; done
          # Asset names without spaces (GitHub would turn them into dots anyway), so latest.json can name the URLs.
          for f in out/*\ *; do [ -f "$f" ] && mv "$f" "${f// /.}"; done
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Replace the desktop-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          ls -la out
          # latest.json for the in-app updater (endpoint in tauri.conf.json), only when the build made signed archives.
          base="https://github.com/$REPO/releases/download/desktop-latest"
          dmg=$(find out -name '*_aarch64.dmg' | head -1)
          version=$(basename "$dmg" | sed -E 's/.*_([0-9]+\.[0-9]+\.[0-9]+)_aarch64\.dmg/\1/')
          if [ -n "$dmg" ] && ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "cannot read the version from $dmg"; exit 1; fi
          platforms='{}'
          add() { # <platform> <file>
            [ -f "out/$2" ] && [ -f "out/$2.sig" ] || return 0
            platforms=$(jq -c --arg p "$1" --arg u "$base/$2" --rawfile s "out/$2.sig" '. + {($p): {url: $u, signature: ($s | rtrimstr("\n"))}}' <<< "$platforms")
          }
          add darwin-aarch64 "$(basename "$(find out -name '*_macos-arm64.app.tar.gz' | head -1)")"
          add darwin-x86_64 "$(basename "$(find out -name '*_macos-x64.app.tar.gz' | head -1)")"
          add windows-x86_64 "$(basename "$(find out -name '*-setup.exe' | head -1)")"
          if [ "$platforms" != '{}' ]; then
            jq -n --arg v "$version" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
              '{version: $v, notes: "", pub_date: $d, platforms: $p}' > out/latest.json
            cat out/latest.json
          fi
          gh release delete desktop-latest --repo "$REPO" --cleanup-tag --yes || true
          gh release create desktop-latest out/* --repo "$REPO" --target "$SHA" \
            --title "Taskcell Desktop (latest)" --latest=false \
            --notes "Installers for Taskcell Desktop, built from $SHA. macOS: .dmg (aarch64 = Apple Silicon, x64 = Intel). Windows: .msi or -setup.exe. Linux: .deb."
