name: Vanguard Implement

# Loop v1 from GitHub Actions:
#   "ready for spec"  -> plan, then build it in the same run
#   "ready for agent" -> build directly
#   too vague         -> "needs info" (human fills it in)
#
# Thin caller of the reusable workflow (implement.yml), which holds the steps. The local `uses: ./`
# form resolves at the run's ref: the default branch for issue/dispatch events, so a PR branch is only
# exercised via `gh workflow run <caller>.yml --ref <branch>`.
#
# Requires repo setting: Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests" (otherwise the
# agent's PR fails with "GitHub Actions is not permitted to create ... pull requests").

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Read-only: the reusable workflow's slot step lists this workflow's in-progress runs (max-parallel).
  actions: read

jobs:
  implement:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'spietrza') ||
      (github.event_name == 'issues' &&
      contains(fromJSON('["ready for spec","ready for agent"]'), github.event.label.name) &&
      contains(fromJSON('["spietrza","pawelkrystkiewicz"]'), github.event.issue.user.login) &&
      contains(fromJSON('["spietrza","pawelkrystkiewicz"]'), github.event.sender.login))
    # Job-level, not workflow-level: label events this job skips (vanguard:* labels, other labels)
    # never enter a group, so they cannot replace and cancel a pending real run. A labelled issue gets
    # its own group and its own run (`watch --issue`), so issues no longer queue behind each other or
    # knock a pending run out of a shared group; `max-parallel` below caps how many work at once. A
    # dispatch has no issue and sweeps every ready one, in a group of its own.
    concurrency:
      group: vanguard-implement-${{ github.repository }}-${{ github.event.issue.number || 'sweep' }}
      cancel-in-progress: false
    uses: ./.github/workflows/implement.yml
    with:
      allowed-actors: '["spietrza","pawelkrystkiewicz"]'
      issue: ${{ github.event.issue.number || '' }}
      max-parallel: '3'
      # Each run gets its own 16 GB runner; at 2048 MB long sessions died with exit 134 (#789, #795).
      sandbox-memory-mb: '8192'
      # Opus plans the spec, Sonnet implements, Fable reviews (Codex's weekly limit is nearly spent).
      # No llm-proxy: Codex runs on a ChatGPT subscription (CODEX_AUTH_JSON), which talks to the
      # ChatGPT backend directly — the proxy allowlist only covers the api.openai.com (API-key) path.
      provider: claude
      provider-model: sonnet
      spec-model: opus
      review-provider: claude
      review-model: claude-fable-5-2
      escalate-model: claude-fable-5-2
      # If Claude is down or out of plan, the implementer retries once on the Codex subscription.
      fallback-provider: codex
      decision-probe: true
      persist-metrics: true
      upload-run-records: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
      # PAT that opens the PR: a PR opened with GITHUB_TOKEN fires no workflows (recursion guard),
      # so it would sit with no CI until someone pushes. Same token as revise.
      VANGUARD_PUSH_TOKEN: ${{ secrets.VANGUARD_PUSH_TOKEN }}
