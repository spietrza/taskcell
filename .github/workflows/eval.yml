name: Eval
# The gate runs a PR's own (agent-authored) code with a model credential in env, so it never runs on
# its own: a maintainer opts a PR in with the `run eval` label after reading the diff, and re-adds it
# after new commits (no `synchronize` trigger, so a later push cannot ride on an old approval). The baseline job
# runs only on main, which is reviewed code.
on:
  pull_request:
    types: [labeled]
    paths:
      - 'src/context/**'
      - 'src/evals/**'
      - 'src/agents/**'
      - 'src/pipeline/**'
  push:
    branches: [main]
    paths:
      - 'src/context/**'
      - 'src/evals/**'
      - 'src/agents/**'
      - 'src/pipeline/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.label.name == 'run eval'
      && github.event.sender.login == 'spietrza'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # eval shells out to the host `claude` CLI, at docker/Dockerfile's pin (scripts/bump-agent-clis.sh moves it). 2.1.260 did not
      # know claude-sonnet-5-5 and hung on the first call (#735).
      - run: npm install -g "@anthropic-ai/claude-code@$(sed -n 's/^ARG CLAUDE_CLI_VERSION=//p' docker/Dockerfile)"
      - name: Eval against main's baseline
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node dist/cli/index.js eval --baseline main

  # Publishing is split in two so the model never runs next to a write token: `baseline` runs the eval
  # with a read-only token and no stored git credentials; `publish-baseline` runs no install, build or
  # model, only appends the report to the metrics branch.
  baseline:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm install -g "@anthropic-ai/claude-code@$(sed -n 's/^ARG CLAUDE_CLI_VERSION=//p' docker/Dockerfile)"
      - name: Run eval
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          node dist/cli/index.js eval --json > eval-report.json
          jq -e '.corpusHash' eval-report.json >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: eval-report.json
          retention-days: 7

  publish-baseline:
    needs: baseline
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes eval-baselines.jsonl to the taskcell-metrics branch
    concurrency:
      group: eval-publish-baseline
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: taskcell-metrics
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eval-report
          path: ${{ runner.temp }}/eval
      - name: Append baseline record
        env:
          COMMIT: ${{ github.sha }}
          REPORT: ${{ runner.temp }}/eval/eval-report.json
        run: |
          # Same record shape and per-commit dedup as `vanguard eval --save-baseline`.
          if [ -f eval-baselines.jsonl ] && jq -e --arg c "$COMMIT" 'select(.commit == $c)' eval-baselines.jsonl >/dev/null; then
            echo "baseline for $COMMIT already saved"; exit 0
          fi
          jq -c --arg c "$COMMIT" --arg t "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" '{commit: $c, timestamp: $t, report: .}' "$REPORT" >> eval-baselines.jsonl
          git add eval-baselines.jsonl
          git -c user.name=Vanguard -c user.email=vanguard@local commit -q -m "eval baseline ${COMMIT:0:7}"
          git push origin HEAD:taskcell-metrics
