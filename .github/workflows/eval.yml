name: Eval
# The gate runs a PR's own (agent-authored) code with a model credential in env, so it never runs on
# its own: a maintainer opts a PR in with the `run eval` label after reading the diff, and re-adds it
# after new commits (no `synchronize` trigger, so a later push cannot ride on an old approval). The baseline job
# runs only on main, which is reviewed code.
on:
  pull_request:
    types: [labeled]
    paths:
      - 'src/context/**'
      - 'src/evals/**'
      - 'src/agents/**'
      - 'src/pipeline/**'
  push:
    branches: [main]
    paths:
      - 'src/context/**'
      - 'src/evals/**'
      - 'src/agents/**'
      - 'src/pipeline/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.label.name == 'run eval'
      && github.event.sender.login == 'spietrza'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # eval shells out to the host `claude` CLI; same pin as docker/Dockerfile.
      - run: npm install -g @anthropic-ai/claude-code@2.1.260
      - name: Eval against main's baseline
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node dist/cli/index.js eval --baseline main

  baseline:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes eval-baselines.jsonl to the vanguard-metrics branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm install -g @anthropic-ai/claude-code@2.1.260
      - name: Save baseline
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node dist/cli/index.js eval --save-baseline
