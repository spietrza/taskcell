name: Taskcell PR Review

# Thin caller of the reusable workflow (pr-review.yml), which holds the steps.

on:
  pull_request_target:
    # labeled: someone asks for a review. opened / ready_for_review: a factory PR that is ready gets one too.
    types: [labeled, opened, ready_for_review]
  workflow_dispatch:

permissions: {} # each job declares what it needs (OpenSSF Scorecard Token-Permissions)

jobs:
  # A factory PR (a Vanguard branch in this repo, opened by an allowed login) that is not a draft gets the
  # trigger label here, so the review below runs without anyone labelling it. A label added with
  # GITHUB_TOKEN starts no new run (recursion guard), so this cannot trigger the review twice.
  label-factory-pr:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    if: >-
      contains(fromJSON('["opened","ready_for_review"]'), github.event.action) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'chore/vanguard-') || startsWith(github.event.pull_request.head.ref, 'chore/taskcell-')) && (
      (contains(fromJSON('["spietrza","pawelkrystkiewicz"]'), github.event.pull_request.user.login) &&
      contains(fromJSON('["spietrza","pawelkrystkiewicz"]'), github.event.sender.login)) ||
      (github.event.pull_request.user.login == 'taskcell[bot]' && github.event.sender.login == 'taskcell[bot]'))
    runs-on: ubuntu-latest
    steps:
      # A PR the taskcell App opened or undrafted is labelled with the PAT, not GITHUB_TOKEN: that `labeled`
      # event starts its own review run with a human sender, which the reusable workflow's allowed-actors
      # check accepts. The bot itself is never an allowed actor (that list also names trusted feedback authors).
      - name: Add the review trigger label
        env:
          GH_TOKEN: ${{ github.event.sender.login == 'taskcell[bot]' && secrets.VANGUARD_PUSH_TOKEN || github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f 'labels[]=ready for taskcell review' --silent

  review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    needs: label-factory-pr
    if: >-
      !cancelled() && (
      github.event_name == 'workflow_dispatch' ||
      (needs.label-factory-pr.result == 'success' && github.event.sender.login != 'taskcell[bot]') ||
      (github.event.action == 'labeled' &&
      contains(fromJSON('["ready for vanguard review","ready for taskcell review"]'), github.event.label.name) &&
      github.event.pull_request.draft == false &&
      contains(fromJSON('["spietrza","pawelkrystkiewicz"]'), github.event.sender.login) && (
      contains(fromJSON('["spietrza","pawelkrystkiewicz"]'), github.event.pull_request.user.login) ||
      (github.event.pull_request.user.login == 'taskcell[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'chore/vanguard-') || startsWith(github.event.pull_request.head.ref, 'chore/taskcell-'))))))
    # Job-level, not workflow-level: a run whose jobs are all skipped (any other label, any other opened PR)
    # never joins the group, so it cannot cancel a review that is waiting in it.
    # One group per PR: GitHub keeps one pending run per group, so a shared group cancelled the waiting
    # review when a third PR was labelled (#1070). Each run then reviews only its own PR (pinned-only).
    concurrency:
      group: taskcell-pr-review-${{ github.repository }}-${{ github.event.pull_request.number || 'sweep' }}
      cancel-in-progress: false
    uses: ./.github/workflows/pr-review.yml
    with:
      allowed-actors: '["spietrza","pawelkrystkiewicz"]'
      # Codex (gpt-6-sol) reviews; Opus 5.5 is the fallback. The proxy holds both plan credentials.
      llm-proxy: true
      provider: codex
      review-model: gpt-6-sol
      fallback-provider: claude
      fallback-model: claude-opus-5-5
      # One run reviews every labelled PR; four at a time instead of two.
      review-concurrency: '4'
      pinned-only: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
