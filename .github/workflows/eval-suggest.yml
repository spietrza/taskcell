name: Eval suggest
# Weekly: draft eval-corpus candidates from human-rejected factory work and open an issue for curation.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  suggest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Draft candidates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          since="$(date -u -d '7 days ago' +%F)"
          node dist/cli/index.js eval --suggest --github-repo "$REPO" --since "$since" --out drafts.md
          gh issue create --repo "$REPO" --title "Eval corpus candidates since $since" --body-file drafts.md
