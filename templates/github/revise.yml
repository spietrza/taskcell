name: Vanguard Revise

# Thin caller of the reusable workflow (revise.yml), which holds the steps.
#
# Triggers on `pull_request` (NOT `pull_request_target`): a `pull_request_target` run checks out
# the base branch's workflow but can still be pointed at an attacker-controlled head, which is the
# wrong trade for a hub-managed, single-maintainer caller. `pull_request` runs with the permissions
# GitHub already grants same-repo PRs, and gets none of the caller's secrets on a fork PR, which is
# the safer default here. Revises only the signed-in user's own PRs (the author gate below) — or
# Taskcell's own bot commits, which carry the `github-actions[bot]` author.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr: { description: "PR number", required: true }

permissions:
  contents: write          # pushes the revision commit to the PR branch
  pull-requests: write     # reply, resolve threads, gh pr ready
  issues: write

jobs:
  revise:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'YOUR_LOGIN') ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'needs revision' &&
       contains(fromJSON('["YOUR_LOGIN","github-actions[bot]"]'), github.event.pull_request.user.login) &&
       github.event.sender.login == 'YOUR_LOGIN')
    # On the job and per PR: skipped label events never enter a group, and revisions of
    # different PRs do not queue behind each other.
    concurrency:
      group: vanguard-revise-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: false
    uses: spietrza/taskcell/.github/workflows/revise.yml@v1
    with:
      allowed-actors: '["YOUR_LOGIN"]'
      number: ${{ github.event.pull_request.number || inputs.pr }}
      llm-proxy: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      VANGUARD_PUSH_TOKEN: ${{ secrets.VANGUARD_PUSH_TOKEN }}
